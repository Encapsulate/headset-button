[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "headset-button"
version = "1.1.1"
description = "Repurpose a Bluetooth headset's centre button: mute the mic, control playback, or run anything"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Encapsulate" }]
keywords = ["bluetooth", "avrcp", "bluez", "microphone", "mute", "mpris", "tray"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Hardware",
]
dependencies = [
    "dbus-python>=1.2",
    "PyGObject>=3.42",
]

[project.urls]
Homepage = "https://github.com/Encapsulate/headset-button"
Issues = "https://github.com/Encapsulate/headset-button/issues"

[project.scripts]
headset-button = "headset_button.cli:main"
headset-button-bridge = "headset_button.bridge:main"
headset-button-tray = "headset_button.tray:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
